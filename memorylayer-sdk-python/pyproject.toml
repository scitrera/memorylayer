[project]
name = "memorylayer-client"
version = "0.2.0"
description = "Python SDK for MemoryLayer.ai - memory infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache 2.0" }
authors = [
    { name = "scitrera.ai", email = "open-source-team@scitrera.com" }
]
keywords = ["ai", "memory", "agents", "llm", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.26.0",
    "pydantic==2.13.4",
    # parse_skill_folder parses SKILL.md YAML frontmatter, which is NESTED
    # (metadata.scitrera.{prereq_skills: [...], preferred_model}). Without PyYAML
    # the parser silently falls back to a flat key:value line-parser that mangles
    # nested maps/lists into empty strings — corrupting seeded skill metadata. It
    # is a base requirement, not optional.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional Aether transport. Pulls in scitrera-aether-client so SDK callers
# (cowork, enterprise integrations) can route through proxy_http_async on
# a shared Aether SDK connection. Default httpx transport stays dep-light.
aether = [
    "scitrera-aether-client>=0.2.2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.20.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    # Pulled into dev so ``tests/test_transport_aether.py`` can import
    # ``scitrera_aether_client.proxy``. Mirrors the optional ``aether`` extra
    # so the test environment matches a real Aether-enabled install.
    "scitrera-aether-client>=0.2.2",
]

[project.urls]
Homepage = "https://memorylayer.ai"
Documentation = "https://docs.memorylayer.ai"
Repository = "https://github.com/scitrera/memorylayer"
Issues = "https://github.com/scitrera/memorylayer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
packages = ["src/memorylayer"]

[tool.hatch.build]
# Package builders must exclude local state even when building from a dirty checkout.
exclude = [
    "**/.omc/**", "**/.claude/**", "**/.codex/**", "**/.agents/**", "**/.slop/**",
    "**/.venv/**", "**/__pycache__/**", "**/node_modules/**",
    "**/.env", "**/.env.*", "**/.mcp.json",
    "**/*.db", "**/*.db-shm", "**/*.db-wal", "**/*.sqlite", "**/*.sqlite3",
    "**/*.pem", "**/*.key", "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memorylayer"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
