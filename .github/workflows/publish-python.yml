# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Publish (Python)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: publish-python
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  tests:
    uses: ./.github/workflows/test-python.yml

  verify-tag:
    name: Verify tag matches memorylayer-sdk-python version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify versions are in sync
        run: uvx --from 'scitrera-repo-tools==0.1.30' sync-versions --check --verbose

      - name: Compare tag against versions.yaml
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared="$(uvx --from 'scitrera-repo-tools==0.1.30' sync-versions --print-version memorylayer-sdk-python)"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the memorylayer-sdk-python version declared in versions.yaml ($declared)"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches versions.yaml ($declared)."

  publish-memorylayer-core-python:
    name: Publish memorylayer-core-python to PyPI
    runs-on: ubuntu-latest
    needs: [ tests, verify-tag ]
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Rewrite local refs to version pins
        run: uvx --from 'scitrera-repo-tools==0.1.30' sync-versions --release

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
        working-directory: memorylayer-core-python

      - name: Check whether this version is already published
        id: published
        working-directory: memorylayer-core-python
        run: |
          set -euo pipefail
          name=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project'].get('name',''))")
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project'].get('version',''))")
          if [ -z "$version" ]; then
            echo "::error::pyproject.toml declares no static version (dynamic?); ci.python.skip_if_published cannot determine what to look up"
            exit 1
          fi
          if curl -sfL -o /dev/null "https://pypi.org/pypi/$name/$version/json"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name $version is already on PyPI; skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI (trusted publisher)
        if: steps.published.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: memorylayer-core-python/dist/

