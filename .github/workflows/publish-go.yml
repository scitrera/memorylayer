# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Publish (Go)

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test-go.yml

  verify-tag:
    name: Verify tag matches memorylayer-sdk-go version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify versions are in sync
        run: uvx --from 'scitrera-repo-tools==0.1.30' sync-versions --check --verbose

      - name: Compare tag against versions.yaml
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared="$(uvx --from 'scitrera-repo-tools==0.1.30' sync-versions --print-version memorylayer-sdk-go)"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the memorylayer-sdk-go version declared in versions.yaml ($declared)"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches versions.yaml ($declared)."

  module-tags:
    name: Publish Go module tags
    runs-on: ubuntu-latest
    needs: [ tests, verify-tag ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Reconcile per-module tags
        env:
          MODULE_DIRS: "memorylayer-sdk-go memorylayer-sdk-go/aether"
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "::error::expected a v-prefixed tag"; exit 1 ;; esac
          VERSION="${GITHUB_REF#refs/tags/}"
          sha="$(git rev-list -n1 "$VERSION")"
          bad=0
          new=""
          for dir in $MODULE_DIRS; do
            tag="$dir/$VERSION"
            have="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
            if [ -z "$have" ]; then
              echo "::notice::creating $tag at $sha"
              git tag "$tag" "$sha"
              new="$new $tag"
            elif [ "$have" != "$sha" ]; then
              echo "::error::$tag exists at $have but the release tag is $sha"
              bad=1
            else
              echo "$tag already correct"
            fi
          done
          [ "$bad" = 0 ]
          if [ -n "$new" ]; then
            git push --atomic origin $new
          fi
