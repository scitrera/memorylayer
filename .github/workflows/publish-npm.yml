name: Publish (npm)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  tests:
    uses: ./.github/workflows/test-npm.yml

  publish-memorylayer-sdk-typescript:
    name: Publish memorylayer-sdk-typescript to npm
    runs-on: ubuntu-latest
    needs: [ tests ]
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Synchronize versions while preserving local refs
        run: uvx --from 'scitrera-repo-tools==0.1.30' sync-versions

      - name: Verify release tag matches package version
        working-directory: memorylayer-sdk-typescript
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF" != "refs/tags/$expected" ]; then
            echo "::error::Select release tag $expected to publish this package"
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::notice::No package-lock.json; using 'npm install'. Commit a lockfile for reproducible installs."
            npm install
          fi
        working-directory: memorylayer-sdk-typescript

      - name: Rewrite local refs to version pins
        run: uvx --from 'scitrera-repo-tools==0.1.30' sync-versions --release

      - name: Build
        run: npm run build --if-present
        working-directory: memorylayer-sdk-typescript

      - name: Check whether this version is already published
        id: published
        working-directory: memorylayer-sdk-typescript
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already on npm; skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public --provenance
        working-directory: memorylayer-sdk-typescript

