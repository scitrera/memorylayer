name: Test (npm)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

concurrency:
  # github.ref is stable across pushes to the same PR (refs/pull/N/merge), so
  # this still cancels a superseded run when you push again — the case where
  # cancelling is the right outcome. It deliberately does NOT collapse the
  # push and pull_request runs of one commit: that duplicate is avoided with
  # ci.push_branches instead, because a cancelled run reports as cancelled
  # rather than as success.
  group: test-npm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-memorylayer-sdk-typescript:
    name: Test memorylayer-sdk-typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: 'npm'
          cache-dependency-path: memorylayer-sdk-typescript/package-lock.json

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::notice::No package-lock.json; using 'npm install'. Commit a lockfile for reproducible installs."
            npm install
          fi
        working-directory: memorylayer-sdk-typescript

      - name: Build
        run: npm run build --if-present
        working-directory: memorylayer-sdk-typescript

      - name: Type-check
        run: npx --no-install tsc --noEmit
        working-directory: memorylayer-sdk-typescript

      - name: Run tests
        run: npm test --if-present
        working-directory: memorylayer-sdk-typescript

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: ts-dist-memorylayer-sdk-typescript
          path: memorylayer-sdk-typescript/dist/
          if-no-files-found: error
          retention-days: 1

